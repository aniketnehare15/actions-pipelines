name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          cache: pip
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: Run tests 
        run: python3 -m pytest
